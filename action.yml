name: Otel CI Visibility
description:
  A GitHub Action to send CI visibility data using OpenTelemetry. Metrics are
  being sent over OTLP/HTTP to a specified endpoint. GRPC will be supported in a
  future release.
author: Borislav Iv., Redis Inc.

branding:
  icon: bar-chart-2
  color: green

inputs:
  junit-xml-folder:
    description: Path to the folder containing JUnit XML files.
    required: true
  otlp-endpoint:
    description: OpenTelemetry OTLP endpoint.
    required: true
  otlp-headers:
    description: OpenTelemetry OTLP headers.
    required: false
  branch-allowlist:
    description: >-
      Comma-separated list of branch names to emit metrics for. Empty (default)
      emits only for the repository default branch, keeping metric cardinality
      bounded. Use '*' to emit for every branch (not recommended).
    required: false
  server-version:
    description: >-
      Optional version of the system under test (e.g. the Redis server version a
      client library's CI matrix runs against). Emitted as the server.version
      label so regressions can be detected per version. Must be a stable,
      bounded value like '8.4' — never a run id, timestamp, or other run-varying
      value, which would mint new metric series every run.
    required: false
  server-version-allowlist:
    description: >-
      Comma-separated list of server versions to emit metrics for, matched
      exactly against the server-version input. Empty (default) emits for any
      server version. Use it to keep the tracked set bounded when the CI matrix
      includes short-lived versions (release candidates, previews) you don't
      want to monitor — their jobs run tests but upload nothing.
    required: false

runs:
  using: node24
  main: dist/index.js
