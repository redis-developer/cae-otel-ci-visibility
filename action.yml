name: Otel CI Visibility
description:
  A GitHub Action to send CI visibility data using OpenTelemetry. Metrics are
  being sent over OTLP/HTTP to a specified endpoint. GRPC will be supported in a
  future release.
author: Borislav Iv., Redis Inc.

branding:
  icon: bar-chart-2
  color: green

inputs:
  junit-xml-folder:
    description: Path to the folder containing JUnit XML files.
    required: true
  otlp-endpoint:
    description: OpenTelemetry OTLP endpoint.
    required: true
  otlp-headers:
    description: OpenTelemetry OTLP headers.
    required: false
  branch-allowlist:
    description: >-
      Comma-separated list of branch names to emit metrics for. Empty (default)
      emits only for the repository default branch, keeping metric cardinality
      bounded. Use '*' to emit for every branch (not recommended).
    required: false
  server-version:
    description: >-
      Optional version track of the system under test (e.g. the Redis server
      version a client library's CI matrix runs against). Emitted as the
      server.version label so regressions are detected per version. Exactly two
      value shapes are accepted: the literal 'unstable' (server built from
      master / under development) or a major.minor version track like '8.4',
      with release candidates, previews and GA builds collapsed into the same
      track ('8.4-rc2' and '8.4.0' must both be passed as '8.4'). Any other
      value — patch versions, image tags, commit SHAs — fails the build, since
      run-varying label values would mint new metric series every run.
    required: false
  on-nondeterministic-ids:
    description: >-
      What to do when generated test ids look nondeterministic (contain
      run-varying values like UUIDs, timestamps or random ports, which mint a
      new metric series every run). 'warn' (default) reports offenders and
      submits everything; 'skip' drops the offenders' per-test data points and
      submits the rest (run/suite rollups still include them); 'break' fails the
      build and uploads nothing.
    required: false

runs:
  using: node24
  main: dist/index.js
