name: Otel CI Visibility
description:
  A GitHub Action to send CI visibility data using OpenTelemetry. Metrics are
  being sent over OTLP/HTTP to a specified endpoint. GRPC will be supported in a
  future release.
author: Borislav Iv., Redis Inc.

branding:
  icon: bar-chart-2
  color: green

inputs:
  junit-xml-folder:
    description: Path to the folder containing JUnit XML files.
    required: true
  otlp-endpoint:
    description: OpenTelemetry OTLP endpoint.
    required: true
  otlp-headers:
    description: OpenTelemetry OTLP headers.
    required: false
  branch-allowlist:
    description: >-
      Comma-separated list of branch names to emit metrics for. Empty (default)
      emits only for the repository default branch, keeping metric cardinality
      bounded. Use '*' to emit for every branch (not recommended).
    required: false
  server-version:
    description: >-
      Optional version track of the system under test (e.g. the Redis server
      version a client library's CI matrix runs against). Emitted as the
      server.version label so regressions are detected per version. Pass the
      track you want a test compared against over time — major.minor like '8.4',
      with release candidates and GA builds collapsed into the same value
      ('8.4-rc2' and '8.4.0' both as '8.4'). Must be a stable, bounded value —
      never a run id, timestamp, or other run-varying value, which would mint
      new metric series every run.
    required: false

runs:
  using: node24
  main: dist/index.js
